apis:
  - aid: kbb:idws
    name: InfoDriver Web Service (IDWS) 4.0
    description: >
      RESTful API providing access to Kelley Blue Book vehicle data, values,
      and content. Endpoints cover vehicle information, new and used pricing,
      expert and consumer ratings and reviews, cost-of-ownership projections,
      fuel cost calculations, and vehicle specifications. Access is via
      api_key query string parameter under a B2B licensing agreement.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.kbb.com/
