aid: kbb
name: Kelley Blue Book
description: >
  Kelley Blue Book (KBB) is the vehicle valuation and automotive information
  platform trusted by consumers, dealers, lenders, and OEMs since 1926.
  KBB provides REST APIs for new and used car values, pricing data, vehicle
  specifications, expert and consumer ratings, cost-of-ownership projections,
  fuel cost calculations, and dealer trade-in tools. The InfoDriver Web
  Service (IDWS) 4.0 delivers JSON over HTTPS authenticated via API key,
  and is licensed to B2B partners including automotive dealers, lenders,
  fleet operators, and industry data consumers. Values are updated twice
  monthly to reflect current market conditions.
